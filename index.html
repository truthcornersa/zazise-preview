<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZAZISE — Make Yourself Known (Pages preview)</title>
  <meta name="description" content="Static GitHub Pages preview of ZAZISE UI. Self-contained — no Afrihost CSS/JS dependency." />
  <link rel="icon" href="assets/favicon/favicon.ico" sizes="any" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="home.css" />
  <style>
    .preview-banner{position:fixed;top:0;left:0;right:0;z-index:9999;background:#183D83;color:#fff;font:600 13px/1.3 system-ui,sans-serif;padding:8px 14px;text-align:center}
    .preview-banner a{color:#E2AE41}
    body.login-body{padding-top:36px}
  </style>
</head>
<body class="home login-body register-body">
  <div class="preview-banner">GitHub Pages preview · self-contained (local CSS/JS/assets) · no Afrihost dependency · PHP APIs do not run here · <a href="register.html">register</a> · <a href="login.html">login</a> · <a href="watch.html">watch</a> · <a href="index-full.html">full home</a></div>
  <div class="auth-bg" aria-hidden="true">
    <div class="auth-bg__slide is-active" style="background-image:url('assets/login-bg-cape-town-planes.jpg')"></div>
  </div>
  <main class="login-page">
    <section class="login-card" aria-labelledby="register-title">
      <div class="logo-block logo-block--lockup">
        <img class="brand-icon-3d" src="assets/zazise-logo-icon-3d-clean@2x.png" alt="" />
        <img class="brand-flat-wordmark" src="assets/zazise-logo-flat-wordmark.png" alt="ZAZISE — Make Yourself Known" />
      </div>
      <h1 id="register-title">Create your account</h1>
      <p class="subtitle">Make yourself known on ZAZISE</p>
      <form class="register-form" action="#" method="post" onsubmit="event.preventDefault();alert('Static preview only — registration API does not run on GitHub Pages.');">
        <div class="field"><label for="n">First name</label><input id="n" name="name" type="text" required placeholder="First name" /></div>
        <div class="field"><label for="s">Surname</label><input id="s" name="surname" type="text" required placeholder="Surname" /></div>
        <div class="field"><label for="e">Email</label><input id="e" name="email" type="email" required placeholder="you@example.co.za" /></div>
        <div class="login-actions"><button type="submit" class="btn-primary">Create account (preview)</button></div>
      </form>
      <div class="login-footer">
        <a href="login.html">Sign in</a>
        <span><a href="help.html">Help</a> · <a href="https://www.zazise.africa/">Live site</a></span>
      </div>
    </section>
  </main>
  <script src="js/auth-bg.js"></script>
</body>
</html>
