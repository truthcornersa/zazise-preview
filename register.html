<body class="home login-body register-body">

      <a href="#" class="lang-pill" role="listitem" hreflang="nr" lang="nr" data-lang="nr" title="isiNdebele">NR</a>
      <a href="#" class="lang-pill" role="listitem" hreflang="en" lang="en" data-lang="sasl" title="South African Sign Language">SASL</a>
    </div>

  <main class="login-page">
    <section class="login-card" aria-labelledby="register-title">
      <div class="logo-block logo-block--lockup">
        <img class="brand-icon-3d" src="assets/zazise-logo-icon-3d-clean@2x.png" alt="" aria-hidden="true" />
        <img class="brand-flat-wordmark" src="assets/zazise-logo-flat-wordmark.png" alt="ZAZISE — Make Yourself Known" />
      </div>
      <h1 id="register-title" data-i18n="title_register">Create your account</h1>
      <p class="subtitle" data-i18n="subtitle_register">Make yourself known on ZAZISE</p>

      <form id="register-form" class="register-form" action="/api/register" method="post" novalidate>
        <div class="field">
          <label for="register-name" data-i18n="label_first_name">First name</label>
          <input id="register-name" name="name" type="text" autocomplete="given-name" required
                 data-i18n-placeholder="placeholder_first_name" placeholder="First name" />
        </div>
        <div class="field">
          <label for="register-surname" data-i18n="label_surname">Surname</label>
          <input id="register-surname" name="surname" type="text" autocomplete="family-name" required
                 data-i18n-placeholder="placeholder_surname" placeholder="Surname" />
        </div>
        <div class="field">
          <label for="register-email" data-i18n="label_email">Email</label>
          <input id="register-email" name="email" type="email" autocomplete="email" required
                 data-i18n-placeholder="placeholder_email" placeholder="you@example.co.za" />
        </div>

        <div class="field field--password">
          <label for="register-password" data-i18n="label_password">Password</label>
          <div class="pw-wrap">
            <input id="register-password" name="password" type="password"
                   autocomplete="new-password" required minlength="12" maxlength="128"
                   data-i18n-placeholder="placeholder_password" placeholder="••••••••" />
            <button type="button" class="pw-toggle" data-pw-toggle="register-password"
                    aria-label="Show password" data-i18n-aria="btn_show_password">
              <span class="pw-toggle__show" data-i18n="btn_show">Show</span>
              <span class="pw-toggle__hide" hidden data-i18n="btn_hide">Hide</span>
            </button>
          </div>
          <p class="pw-strength" id="pw-strength" aria-live="polite" hidden></p>
        </div>

        <div class="field field--password">
          <label for="register-password-confirm" data-i18n="label_password_confirm">Confirm password</label>
          <div class="pw-wrap">
            <input id="register-password-confirm" name="passwordConfirm" type="password"
                   autocomplete="new-password" required minlength="12" maxlength="128"
                   data-i18n-placeholder="placeholder_password" placeholder="••••••••" />
            <button type="button" class="pw-toggle" data-pw-toggle="register-password-confirm"
                    aria-label="Show password" data-i18n-aria="btn_show_password">
              <span class="pw-toggle__show" data-i18n="btn_show">Show</span>
              <span class="pw-toggle__hide" hidden data-i18n="btn_hide">Hide</span>
            </button>
          </div>
        </div>

        <!-- Honeypot (bots fill this; humans never see it) -->
        <div class="hp-trap" aria-hidden="true">
          <label for="register-website">Website</label>
          <input id="register-website" name="website" type="text" tabindex="-1" autocomplete="off" />
        </div>

        <div class="field field--recaptcha">
          <div class="g-recaptcha"
               data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>
        </div>

        <div class="login-actions login-actions--register">
          <p class="link-muted register-signin" hidden>
            <span data-i18n="already_account">Already have an account?</span>
            <a href="login.html" data-i18n="sign_in">Sign in</a>
          </p>
          <button type="submit" class="btn-primary" data-submit data-i18n="btn_create">Create account</button>
        </div>
      </form>

      <div class="login-footer">
        <span data-i18n-region>South Africa · EN</span>
        <span><a href="help.html" data-i18n="help">Help</a> · <a href="privacy.html" data-i18n="privacy">Privacy</a> · <a href="terms.html" data-i18n="terms">Terms</a></span>
      </div>
    </section>
