<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZAZISE — Sign in (preview)</title>
  <link rel="icon" href="https://www.zazise.africa/assets/favicon/favicon.ico" />
  <link rel="stylesheet" href="https://www.zazise.africa/styles.css" />
  <link rel="stylesheet" href="https://www.zazise.africa/home.css" />
</head>
<body class="home login-body register-body">
  <div class="auth-bg" aria-hidden="true">
    <div class="auth-bg__slide is-active" style="background-image:url('https://www.zazise.africa/assets/login-bg-joburg-skyline.jpg')"></div>
  </div>
  <main class="login-page">
    <section class="login-card">
      <div class="logo-block logo-block--lockup">
        <img class="brand-icon-3d" src="https://www.zazise.africa/assets/zazise-logo-icon-3d-clean@2x.png" alt="" />
        <img class="brand-flat-wordmark" src="https://www.zazise.africa/assets/zazise-logo-flat-wordmark.png" alt="ZAZISE" />
      </div>
      <h1>Sign in</h1>
      <p class="subtitle">Welcome back to ZAZISE</p>
      <form class="register-form" action="#" onsubmit="event.preventDefault();alert('Static preview — login API does not run on GitHub Pages.');">
        <div class="field"><label>Email</label><input type="email" required placeholder="you@example.co.za" /></div>
        <div class="field"><label>Password</label><input type="password" required /></div>
        <div class="login-actions"><button type="submit" class="btn-primary">Sign in (preview)</button></div>
      </form>
      <div class="login-footer"><a href="index.html">Create account</a><span><a href="https://www.zazise.africa/">Live site</a></span></div>
    </section>
  </main>
</body>
</html>
