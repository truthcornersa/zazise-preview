<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZAZISE — Sign in (preview)</title>
  <link rel="icon" href="assets/favicon/favicon.ico" />
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="home.css" />
  <style>
    .preview-banner{position:fixed;top:0;left:0;right:0;z-index:9999;background:#183D83;color:#fff;font:600 13px/1.3 system-ui,sans-serif;padding:8px 14px;text-align:center}
    .preview-banner a{color:#E2AE41}
    body.login-body{padding-top:36px}
  </style>
</head>
<body class="home login-body register-body">
  <div class="preview-banner">GitHub Pages preview · self-contained local CSS/JS/assets/fonts · preview only · <a href="register.html">register</a> · <a href="watch.html">watch</a></div>
  <div class="auth-bg" aria-hidden="true">
    <div class="auth-bg__slide is-active" style="background-image:url('assets/login-bg-cape-town-planes.jpg')"></div>
  </div>
  <main class="login-page">
    <section class="login-card">
      <div class="logo-block logo-block--lockup">
        <img class="brand-icon-3d" src="assets/zazise-logo-icon-3d-clean@2x.png" alt="" />
        <img class="brand-flat-wordmark" src="assets/zazise-logo-flat-wordmark.png" alt="ZAZISE" />
      </div>
      <h1>Sign in</h1>
      <p class="subtitle">Welcome back to ZAZISE</p>
      <form class="register-form" action="#" onsubmit="event.preventDefault();alert('Static preview — login API does not run on GitHub Pages.');">
        <div class="field"><label>Email</label><input type="email" required placeholder="you@example.co.za" /></div>
        <div class="field"><label>Password</label><input type="password" required /></div>
        <div class="login-actions"><button type="submit" class="btn-primary">Sign in (preview)</button></div>
      </form>
      <div class="login-footer"><a href="register.html">Create account</a><span>preview only</span></div>
    </section>
  </main>
  <script src="js/auth-bg.js"></script>
</body>
</html>
